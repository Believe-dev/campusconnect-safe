        console.log('[Capacitor] URL:', typeof URL !== 'undefined');
        console.log('[Capacitor] URLSearchParams:', typeof URLSearchParams !== 'undefined');
        
        // Ensure localStorage is accessible and working
        if (typeof localStorage === 'undefined' || !localStorage) {
          console.error('[Capacitor] localStorage not available');
        } else {
          // Test localStorage write capability immediately
          try {
            const testKey = '__supabase_storage_test__';
            localStorage.setItem(testKey, 'test');
            localStorage.removeItem(testKey);
            console.log('[Capacitor] localStorage is working');

        // Check BroadcastChannel
        if (typeof BroadcastChannel !== 'undefined') {
          console.log('[Capacitor] BroadcastChannel already exists');
        } else {
          console.log('[Capacitor] Adding BroadcastChannel polyfill');
          // Enhanced BroadcastChannel polyfill for Supabase compatibility
          window.BroadcastChannel = class BroadcastChannel {
            constructor(name) { 
              this.name = name;
              this._listeners = new Set();
              this.onmessage = null;
              this.onmessageerror = null;
            }
            postMessage(message) {
              // Create a proper MessageEvent
              const event = new MessageEvent('message', {
                data: message,
                origin: window.location.origin,
                source: window
              });
              
              // Call onmessage handler if set
              if (this.onmessage) {
                try { this.onmessage(event); } catch(e) { console.error('[BroadcastChannel] onmessage error:', e); }
              }
              
              // Call all registered listeners
              this._listeners.forEach(listener => {
                try { listener(event); } catch(e) { console.error('[BroadcastChannel] listener error:', e); }
              });
            }
            close() {
              this._listeners.clear();
              this.onmessage = null;
              this.onmessageerror = null;
            }
            addEventListener(type, listener, options) {
              if (type === 'message' && typeof listener === 'function') {
                this._listeners.add(listener);
              }
            }
            removeEventListener(type, listener, options) {
              if (type === 'message') {
                this._listeners.delete(listener);
              }
            }
            dispatchEvent(event) {
              if (event.type === 'message') {
                if (this.onmessage) {
                  this.onmessage(event);
                }
                this._listeners.forEach(listener => listener(event));
                return true;
              }
              return false;
            }
          };
        }
      }
