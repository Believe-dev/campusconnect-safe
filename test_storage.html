<!DOCTYPE html>
<html>
<head>
    <title>Storage Test</title>
</head>
<body>
    <h1>Storage Bucket Test</h1>
    <div id="result"></div>
    
    <script>
        // Test if we can access the storage bucket directly
        const testUrl = 'https://ssqplkrxtrvfptrsnpow.supabase.co/storage/v1/object/public/verification-photos/e4705294-8d84-48ba-8e48-ff8518ec8218/student_id-1758022838240.jpg';
        
        fetch(testUrl, { method: 'HEAD' })
            .then(response => {
                document.getElementById('result').innerHTML = `
                    <p>URL: ${testUrl}</p>
                    <p>Status: ${response.status}</p>
                    <p>Result: ${response.ok ? '✅ SUCCESS - Image accessible' : '❌ FAILED - Check storage permissions'}</p>
                    ${response.ok ? `<img src="${testUrl}" style="max-width: 300px; border: 1px solid #ccc;">` : ''}
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `
                    <p>URL: ${testUrl}</p>
                    <p>Error: ${error.message}</p>
                    <p>Result: ❌ FAILED - Network or CORS error</p>
                `;
            });
    </script>
</body>
</html>
